<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexo - Criar conta</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="auth-page">
        <div class="shape shape-purple"></div>
        <div class="shape shape-orange"></div>
        <div class="shape shape-pink"></div>

        <section class="login-card">
            <div class="brand small">
                <div class="brand-icon">✦</div>
                <div class="brand-name">nexo</div>
            </div>

            <h1 id="role-title">Criar conta</h1>
            <p class="subtitle" id="role-subtitle"></p>

            <form id="cadastroForm">
                <div class="input-box"><span>👤</span><input id="nome" type="text" placeholder="Seu nome" maxlength="40" autocomplete="name" required></div>
                <div class="input-box" id="codigo-box" hidden><span>🔗</span><input id="codigo" type="text" placeholder="Código NX- do responsável" maxlength="12" autocomplete="off"></div>
                <p class="hint" id="code-hint" hidden>Peça ao responsável o código do seu perfil, em Meus filhos. Ele deve cadastrar você primeiro.</p>
                <div class="input-box">
                    <span>✉</span>
                    <input id="email" type="text" placeholder="E-mail ou usuário" autocomplete="username">
                </div>

                <div class="input-box">
                    <span>♙</span>
                    <input id="senha" type="password" placeholder="Senha" autocomplete="new-password">
                </div>

                <div class="input-box">
                    <span>♙</span>
                    <input id="confirmacao" type="password" placeholder="Confirmar senha" autocomplete="new-password">
                </div>

                <button class="primary-button" type="submit">Criar conta</button>
            </form>

            <a class="back-link" id="back-login" href="login.html">Voltar para o login</a><a class="back-link" href="index.html">Trocar tipo de perfil</a>
        </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/familia.js"></script><script src="js/access.js"></script><script src="js/cadastro.js"></script>
</body>
</html>
